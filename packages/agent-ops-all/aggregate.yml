# agent-ops 聚合包清单：patchFrom 的包其 cordis.patch.yml insert 行会被汇总进本包 patch；
# deps 的包进 package.json dependencies（workspace:*），DSH loader 从 profile 顶层解析
# patch 行（默认 hoisted 布局满足；严格布局需在 profile 配 hoist）。
# 编辑本文件后运行 `node scripts/aggregate.mjs` 重新生成。
patchFrom:
  - ../dsh-web-ui-compat
  - ../dsh-ssh
  - ../dsh-telnet
deps:
  - ../dsh-web-ui-compat
  - ../dsh-ssh
  - ../dsh-telnet
